name: Notebooks

# The comparison notebooks (03-10) run many full simulations, too slow for every push: run every notebook
# weekly and on demand, so they cannot go stale.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandsolver and this package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandsolver @ git+https://github.com/jcbernard87/bandsolver@v0.1.2"
          python -m pip install -e ".[notebooks]" nbconvert ipykernel
      - name: Execute every notebook
        run: |
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute "$nb" --output-dir "$RUNNER_TEMP" --ExecutePreprocessor.timeout=7200
            echo "::endgroup::"
          done
