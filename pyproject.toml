[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "znmno2-model"
version = "0.2.0"
description = "Zn/MnO2 aqueous cell model (dissolution-deposition, Zn intercalation, ZHS), solved with bandsolver"
license = "BSD-3-Clause"
requires-python = ">=3.9"
dependencies = ["numpy", "bandsolver>=0.1.2"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyterlab"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
znmno2_model = ["data/*.txt", "data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "private_checks"]
filterwarnings = ["error::RuntimeWarning"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
# I is the current; compact statements mirror the Fortran; short lambdas name local formulas
ignore = ["E741", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"python/znmno2_model/faithful/*.py" = ["E501"]   # statement by statement as in the original programs
